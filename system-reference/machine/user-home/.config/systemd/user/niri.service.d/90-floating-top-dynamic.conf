# Dynamic floating top boundary, takes effect at next login.
# Previous floating-family configuration remains intact.
# Rollback backup: @HOME@/.local/state/niri-floating-dynamic-top-20261114-250970e6
[Service]
ExecStart=
ExecStart=@HOME@/.local/lib/niri-desktop/niri-floating-dynamic-top-20261114-250970e6 --session --config @HOME@/.config/niri/floating-top-dynamic.kdl
