# Personal niri build: official niri + NVIDIA patch stack
# (statnixlab/niri-edge machine/nvidia-desktop 68ffd039).
# Roll back: change the binary below to niri-titlebar-native-20261104,
# then run "systemctl --user daemon-reload" and log in again.
# Previous drop-ins are kept in ~/.local/state/niri-dropins-backup-20261112/.
[Service]
ExecStart=
ExecStart=%h/.local/lib/niri-desktop/niri-official-20261112 --session --config %h/.config/niri/titlebar-native-buttons.kdl
