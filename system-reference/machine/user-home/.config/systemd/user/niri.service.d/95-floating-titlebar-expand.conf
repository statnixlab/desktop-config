# Takes effect at next login. Rollback backup: @HOME@/.local/state/niri-floating-expand-20261114-254fd55d
[Service]
ExecStart=
ExecStart=@HOME@/.local/lib/niri-desktop/niri-floating-expand-20261114-254fd55d --session --config @HOME@/.config/niri/floating-top-dynamic.kdl
