<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Maple Mono CN</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro Text</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro Display</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer>
      <family>HarmonyOS Sans SC</family>
      <family>PingFang SC</family>
      <family>Inter</family>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>PingFang SC</family>
    <prefer>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>PingFang TC</family>
    <prefer>
      <family>PingFang UI TC</family>
      <family>Noto Sans CJK TC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>PingFang HK</family>
    <prefer>
      <family>PingFang UI HK</family>
      <family>Noto Sans CJK HK</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>SF Mono</family>
    <prefer>
      <family>Maple Mono CN</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Menlo</family>
    <prefer>
      <family>Maple Mono CN</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Inter</family>
    <accept>
      <family>PingFang UI SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="strong">
    <family>Maple Mono CN</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="strong">
    <family>Noto Color Emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>NotoColorEmoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
