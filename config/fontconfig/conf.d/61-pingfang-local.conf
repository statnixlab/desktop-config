<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--Use ShmilyHTT/PingFang with the existing Inter / PingFang UI SC desktop fallback.-->
  <alias binding="strong">
    <family>PingFang UI SC</family>
    <prefer>
      <family>PingFang SC</family>
    </prefer>
  </alias>
  <!--These six files all advertise OS/2 weight 400. Correct fontconfig metadata only; font files remain unchanged.-->
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-ExtraLight.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>extralight</const>
    </edit>
  </match>
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-Light.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>light</const>
    </edit>
  </match>
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-Regular.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>regular</const>
    </edit>
  </match>
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-Medium.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-Bold.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>
  <match target="scan">
    <test name="file" compare="eq">
      <string>@HOME@/.local/share/fonts/pingfang-shmilyhtt/PingFang-Heavy.ttf</string>
    </test>
    <edit name="weight" mode="assign">
      <const>heavy</const>
    </edit>
  </match>
</fontconfig>
